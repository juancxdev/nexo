services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo-local-only
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [nexo_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 3s
      timeout: 3s
      retries: 20
  core-api:
    build: ./backend
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgres://core_app:core-app-local-only@postgres:5432/nexo?sslmode=disable
      NEXO_JWT_ISSUER: http://core-api:8081
      NEXO_JWT_AUDIENCE: nexo-services
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nexo.fiis-unas.space,http://localhost:5174,http://127.0.0.1:5174}
      HUKID_PASS_BASE_URL: ${HUKID_PASS_BASE_URL:-http://hukid-node:8080/v1}
      HUKID_PASS_OAUTH_URL: ${HUKID_PASS_OAUTH_URL:-http://hukid-node:8080/oauth2/token}
      HUKID_PASS_CLIENT_ID: ${HUKID_PASS_CLIENT_ID:-33333333-3333-4333-8333-333333333333}
      HUKID_PASS_CLIENT_SECRET: ${HUKID_PASS_CLIENT_SECRET:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      NEXO_JWT_PRIVATE_KEY_PATH: /var/lib/nexo/keys/jwt-rsa.pem
      NEXO_JWT_KEY_RING_DIR: /var/lib/nexo/keys
      # Development-only secret. Production injects it through its secret manager.
      NEXO_INTERNAL_ROTATION_TOKEN: nexo-local-rotate-only
      NEXO_JWT_ROTATION_WINDOW: 9h
      NEXO_CORE_API_ADDR: :8081
    volumes: [nexo_core_keys:/var/lib/nexo/keys]
    ports: ["8081:8081"]
  onsite-operations-api:
    build: ./microservices/onsite-operations
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://onsite_app:onsite-app-local-only@postgres:5432/nexo?sslmode=disable
      ONSITE_ADDR: :8082
      CORE_JWKS_URL: http://core-api:8081/.well-known/jwks.json
      NEXO_JWT_ISSUER: http://core-api:8081
      NEXO_JWT_AUDIENCE: nexo-services
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nexo.fiis-unas.space,http://localhost:5174,http://127.0.0.1:5174}
    ports: ["8082:8082"]
  participation-api:
    build: ./microservices/participation
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://participation_app:participation-app-local-only@postgres:5432/nexo?sslmode=disable
      PARTICIPATION_ADDR: :8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nexo.fiis-unas.space,http://localhost:5174,http://127.0.0.1:5174}
      EVENT_OPERATIONS_URL: http://event-operations-api:8083
      NEXO_INTERNAL_SERVICE_TOKEN: nexo-local-service-only
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
  event-operations-api:
    build: ./microservices/event-operations
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://operations_app:operations-app-local-only@postgres:5432/nexo?sslmode=disable
      OPERATIONS_ADDR: :8083
      CORE_JWKS_URL: http://core-api:8081/.well-known/jwks.json
      NEXO_JWT_ISSUER: http://core-api:8081
      NEXO_JWT_AUDIENCE: nexo-services
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nexo.fiis-unas.space,http://localhost:5174,http://127.0.0.1:5174}
      # Development-only AES-256 key. Production injects it through a secret manager.
      HUKID_CLAIMS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NEXO_INTERNAL_SERVICE_TOKEN: nexo-local-service-only
      NEXO_PUBLIC_BASE_URL: ${NEXO_PUBLIC_BASE_URL:-https://nexo.fiis-unas.space}
      # HukID real/sandbox: si están vacías se usa integration.hukid_configs.
      HUKID_BASE_URL: ${HUKID_BASE_URL:-}
      HUKID_OAUTH_URL: ${HUKID_OAUTH_URL:-}
      HUKID_ISSUER_ID: ${HUKID_ISSUER_ID:-}
      HUKID_CREDENTIAL_DEFINITION: ${HUKID_CREDENTIAL_DEFINITION:-}
      HUKID_PARTICIPATION_CREDENTIAL_DEFINITION: ${HUKID_PARTICIPATION_CREDENTIAL_DEFINITION:-}
      HUKID_CLIENT_ID: ${HUKID_CLIENT_ID:-}
      HUKID_CLIENT_SECRET: ${HUKID_CLIENT_SECRET:-}
      HUKID_CA_CERT_FILE: ${HUKID_CA_CERT_FILE:-}
      HUKID_CLIENT_CERT_FILE: ${HUKID_CLIENT_CERT_FILE:-}
      HUKID_CLIENT_KEY_FILE: ${HUKID_CLIENT_KEY_FILE:-}
    ports: ["8083:8083"]
  event-configuration-api:
    build: ./microservices/event-configuration
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      NODE_ENV: development
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nexo
      POSTGRES_USER: configuration_app
      POSTGRES_PASSWORD: configuration-app-local-only
      AUTH_MODE: nexo_jwks
      CORE_JWKS_URL: http://core-api:8081/.well-known/jwks.json
      NEXO_JWT_ISSUER: http://core-api:8081
      NEXO_JWT_AUDIENCE: nexo-services
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nexo.fiis-unas.space,http://localhost:5174,http://127.0.0.1:5174}
      MEMBERSHIP_MODE: mock
      BROKER_MODE: simulator
    ports: ["${EVENT_CONFIGURATION_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/configuration/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  event-configuration-worker:
    build: ./microservices/event-configuration
    command: ["node", "apps/configuration-worker/src/main.mjs"]
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nexo
      POSTGRES_USER: configuration_app
      POSTGRES_PASSWORD: configuration-app-local-only
      BROKER_MODE: simulator
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      WORKER_TENANT_IDS: 0194eb00-0000-7000-8000-000000000001,0194eb00-0000-7000-8000-000000000002
      WORKER_POLL_INTERVAL_MS: "1000"
      WORKER_BATCH_SIZE: "10"
      WORKER_LEASE_SECONDS: "60"
      WORKER_MAX_BACKOFF_SECONDS: "300"
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const file=process.env.WORKER_HEARTBEAT_FILE;const ts=Number(fs.readFileSync(file,'utf8'));process.exit(Number.isFinite(ts)&&Date.now()-ts<30000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  minio:
    image: ${MINIO_IMAGE:-dappros/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: nexo, MINIO_ROOT_PASSWORD: nexo-local-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [nexo_minio_data:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  hukid-simulator:
    build: ./tools/hukid-simulator
    environment:
      HUKID_PUBLIC_BASE_URL: ${HUKID_PUBLIC_BASE_URL:-https://api-hukid.fiis-unas.space}
    ports: ["8090:8090"]

volumes:
  nexo_pg_data:
  nexo_minio_data:
  nexo_core_keys:
