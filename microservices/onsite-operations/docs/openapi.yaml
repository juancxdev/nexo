openapi: 3.1.0
info:
  title: Nexo Onsite Operations API
  version: 1.0.0
  description: API persistente para la operación presencial de eventos.
servers:
  - url: http://localhost:8082
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Onsite
paths:
  /onsite/v1/verification-sessions:
    post:
      summary: Inicia una sesión OID4VP en HukID
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: {type: integer, minimum: 60, maximum: 900}
                event_id: {type: string}
                scope: {type: string}
                ticket_id: {type: string}
      responses:
        '201': {description: Sesión creada con launch_uri}
        '503': {description: HukID no configurado o no disponible}
  /onsite/v1/verification-sessions/{id}:
    get:
      summary: Consulta el resultado de una sesión OID4VP
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Estado de la sesión}
        '503': {description: HukID no disponible}
  /health/live:
    get:
      tags: [Health]
      responses:
        '200': {description: Servicio activo, content: {application/json: {schema: {$ref: '#/components/schemas/HealthResponse'}}}}
  /health/ready:
    get:
      tags: [Health]
      security: []
      responses:
        '200': {description: PostgreSQL disponible, content: {application/json: {schema: {$ref: '#/components/schemas/HealthResponse'}}}}
        '503': {description: PostgreSQL no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /onsite/v1/readiness:
    get:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/EventId'}, {$ref: '#/components/parameters/Scope'}]
      responses:
        '200': {description: Estado del puesto, content: {application/json: {schema: {$ref: '#/components/schemas/Readiness'}}}}
        '403': {description: Asignación inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /onsite/v1/tickets/search:
    get:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/Query'}, {$ref: '#/components/parameters/EventId'}, {$ref: '#/components/parameters/Scope'}]
      responses:
        '200': {description: Candidatos minimizados, content: {application/json: {schema: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/TicketSearchResult'}}}}}
        '400': {description: Query inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /onsite/v1/attendance/check-ins:
    post:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CheckInRequest'}, example: {ticket_id: DEMO-2026-001, event_id: event-demo, scope: main}}}}
      responses:
        '201': {description: Entrada registrada, content: {application/json: {schema: {$ref: '#/components/schemas/AttendanceFact'}}}}
        '400': {description: Request inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: Duplicado o key reutilizada, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Ticket no admisible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /onsite/v1/attendance/check-outs:
    post:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CheckInRequest'}}}}
      responses:
        '201': {description: Salida registrada, content: {application/json: {schema: {$ref: '#/components/schemas/AttendanceFact'}}}}
        '409': {description: No presente o idempotency conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /onsite/v1/attendance/facts/{id}/voids:
    post:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/FactId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VoidRequest'}}}}
      responses:
        '201': {description: Hecho compensatorio, content: {application/json: {schema: {$ref: '#/components/schemas/AttendanceFact'}}}}
        '403': {description: Scope insuficiente, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /onsite/v1/devices:
    get:
      tags: [Onsite]
      responses: {'200': {description: Dispositivos del tenant, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Device'}}}}}}}}
    post:
      tags: [Onsite]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceCreate'}}}}
      responses: {'201': {description: Dispositivo registrado, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}}
  /onsite/v1/devices/{id}/revocations:
    post:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/FactId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VoidRequest'}}}}
      responses: {'204': {description: Dispositivo revocado}}
  /onsite/v1/shifts:
    post:
      tags: [Onsite]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [event_id, scope], properties: {event_id: {type: string}, scope: {type: string}}}}}}
      responses: {'201': {description: Turno abierto}}
  /onsite/v1/attendance:
    get:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/EventId'}, {$ref: '#/components/parameters/Scope'}, {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}, {name: cursor, in: query, required: false, schema: {type: string}}]
      responses:
        '200': {description: Historial append-only, content: {application/json: {schema: {$ref: '#/components/schemas/AttendancePage'}}}}
        '400': {description: Filtro inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /onsite/v1/dashboard:
    get:
      tags: [Onsite]
      parameters: [{$ref: '#/components/parameters/EventId'}]
      responses:
        '200': {description: Métricas operativas, content: {application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}
  /onsite/v1/events:
    get:
      tags: [Onsite]
      summary: Eventos operables del tenant activo
      responses: {'200': {description: Catálogo de eventos, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/OperableEvent'}}}}}}}}
  /onsite/v1/events/{event_id}/roster:
    get:
      tags: [Onsite]
      summary: Padrón confirmado y estado efectivo de asistencia
      parameters: [{name: event_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/Scope'}]
      responses: {'200': {description: Padrón operacional, content: {application/json: {schema: {$ref: '#/components/schemas/RosterPage'}}}}}
  /onsite/v1/scans:
    post:
      tags: [QR]
      summary: Verifica un QR firmado por Participation (OO-010/016). Un rechazo responde 200 con accepted=false y queda registrado.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRequest'}}}}
      responses:
        '200': {description: Resultado de la verificación, content: {application/json: {schema: {$ref: '#/components/schemas/ScanResult'}}}}
        '403': {description: Sin asignación vigente}
  /onsite/v1/scans/provisional:
    post:
      tags: [QR]
      summary: Supervisión acepta un ticket recién emitido aún sin proyección (OO-017). Exige revocaciones frescas; queda auditado.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRequest'}}}}
      responses:
        '201': {description: Ticket provisional creado}
        '403': {description: Requiere rol supervisor o manager}
        '409': {description: 'revocations_stale | not_provisional_candidate'}
        '422': {description: QR inválido para este punto de control}
  /onsite/v1/scan-stats:
    get:
      tags: [QR]
      summary: Rechazos de las últimas 24 h agrupados por motivo, sin datos personales.
      parameters: [{$ref: '#/components/parameters/EventId'}]
      responses: {'200': {description: Conteo por motivo}}
  /onsite/v1/sessions:
    get:
      tags: [Sesiones]
      summary: Sesiones del evento con acceso, aforo y ocupación (OO-015).
      parameters: [{$ref: '#/components/parameters/EventId'}]
      responses: {'200': {description: Sesiones}}
  /onsite/v1/sessions/{code}/entries:
    post:
      tags: [Sesiones]
      summary: Registra el ingreso a una sesión con ticket_id o QR. No modifica la asistencia principal.
      parameters: [{name: code, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [event_id], properties: {event_id: {type: string}, ticket_id: {type: string}, token: {type: string}}}}}}
      responses:
        '201': {description: Entrada registrada}
        '409': {description: 'already_in_session | session_full'}
        '422': {description: 'session_not_allowed | session_closed | ticket_*'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    EventId: {name: event_id, in: query, required: true, schema: {type: string, minLength: 1}, example: event-demo}
    Scope: {name: scope, in: query, required: true, schema: {type: string, minLength: 1}, example: main}
    Query: {name: q, in: query, required: true, schema: {type: string, minLength: 4}, example: DEMO-2026-001}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    FactId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    HealthResponse: {type: object, required: [status], properties: {status: {type: string, example: ok}, database: {type: string, example: ready}}}
    CheckInRequest: {type: object, required: [ticket_id, event_id, scope], properties: {ticket_id: {type: string, example: DEMO-2026-001}, event_id: {type: string, example: event-demo}, scope: {type: string, example: main}}}
    TicketSearchResult: {type: object, required: [ticket_id, masked_holder, status], properties: {ticket_id: {type: string}, masked_holder: {type: string}, status: {type: string, enum: [active, revoked, expired]}}}
    AttendanceFact: {type: object, required: [id, ticket_id, event_id, scope, type, occurred_at, effective_status], properties: {id: {type: string, format: uuid}, ticket_id: {type: string}, event_id: {type: string}, scope: {type: string}, type: {type: string, enum: [check_in, check_out, void]}, occurred_at: {type: string, format: date-time}, effective_status: {type: string}}}
    AttendancePage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AttendanceFact'}}, next_cursor: {type: string, nullable: true}}}
    Dashboard: {type: object, required: [registered, confirmed, present, attendance_rate], properties: {registered: {type: integer}, confirmed: {type: integer}, present: {type: integer}, attendance_rate: {type: number, format: double}}}
    OperableEvent: {type: object, required: [id, name, status, starts_at, ends_at], properties: {id: {type: string}, name: {type: string}, status: {type: string}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}, timezone: {type: string}, published_revision: {type: integer}}}
    RosterPage: {type: object, required: [items, summary], properties: {items: {type: array, items: {type: object, required: [registration_id, ticket_id, display_name, state], properties: {registration_id: {type: string, format: uuid}, ticket_id: {type: string}, display_name: {type: string}, state: {type: string}, checked_in_at: {type: string, format: date-time, nullable: true}, checked_out_at: {type: string, format: date-time, nullable: true}}}}, summary: {type: object}}}
    Readiness: {type: object, required: [ready, event_id, scope, device_id], properties: {ready: {type: boolean}, event_id: {type: string}, scope: {type: string}, device_id: {type: string}}}
    VoidRequest: {type: object, required: [reason], properties: {reason: {type: string, minLength: 5, maxLength: 500, description: 'Menos de 5 caracteres responde 422 reason_required. Un registro sólo se anula una vez (409 already_voided); anular una salida devuelve la presencia.'}}}
    ScanRequest: {type: object, required: [token, event_id, scope], properties: {token: {type: string, description: 'JWS compacto EdDSA (Ed25519) emitido por Participation'}, event_id: {type: string, example: event-demo}, scope: {type: string, example: main}}}
    ScanResult: {type: object, required: [accepted, can_resolve, provisional], properties: {accepted: {type: boolean}, reason: {type: string, enum: [qr_malformed, qr_unsupported_alg, qr_unknown_key, qr_bad_signature, qr_wrong_audience, wrong_event, wrong_scope, ticket_expired, ticket_revoked, ticket_invalid, ticket_not_materialized]}, can_resolve: {type: boolean}, provisional: {type: boolean}, ticket: {type: object, properties: {ticket_id: {type: string}, masked_holder: {type: string}, expires_at: {type: string, format: date-time}}}}}
    DeviceCreate: {type: object, required: [label], properties: {label: {type: string}, venue_id: {type: string}, public_key: {type: string}, release_version: {type: string}}}
    Device: {type: object, required: [id, tenant_id, label, status], properties: {id: {type: string, format: uuid}, tenant_id: {type: string, format: uuid}, label: {type: string}, status: {type: string, enum: [active, revoked]}, venue_id: {type: string}, release_version: {type: string}, last_seen_at: {type: string, format: date-time, nullable: true}}}
    Problem: {type: object, required: [type, title, status, code, detail, trace_id], properties: {type: {type: string}, title: {type: string}, status: {type: integer}, code: {type: string}, detail: {type: string}, trace_id: {type: string}}}
