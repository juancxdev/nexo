openapi: 3.1.0
info: {title: Nexo Event Operations API, version: 0.1.0}
servers: [{url: 'http://localhost:8083'}]
paths:
  /health/live: {get: {responses: {'200': {description: OK}}}}
  /operations/v1/report-jobs:
    post:
      operationId: createReportJob
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportJobCreate'}}}}
      responses: {'202': {description: Accepted}, '400': {$ref: '#/components/responses/Problem'}}
  /operations/v1/report-jobs/{id}:
    get:
      operationId: getReportJob
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Job}, '404': {$ref: '#/components/responses/Problem'}}
  /operations/v1/report-jobs/{id}/cancellations:
    post:
      operationId: cancelReportJob
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Cancelled}}
  /operations/v1/certificate-jobs:
    post:
      operationId: issueCertificate
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CertificateCreate'}}}}
      responses: {'201': {description: Certificate evidence created; delivery is delegated to HukID}}
  /operations/v1/participation-credentials:
    post:
      operationId: requestParticipationCredential
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ParticipationCredentialCreate'}}}}
      responses: {'202': {description: Participation credential accepted}, '409': {$ref: '#/components/responses/Problem'}}
  /operations/v1/certificates/{id}/hukid-deliveries:
    post:
      operationId: requestHukidDelivery
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HukidDeliveryCreate'}}}}
      responses: {'202': {description: Accepted delivery}}
    get:
      operationId: getHukidDelivery
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Delivery}}
  /operations/v1/hukid-deliveries/{id}/cancellations:
    post:
      operationId: cancelHukidDelivery
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Delivery cancelled}, '409': {$ref: '#/components/responses/Problem'}}
  /operations/v1/hukid-deliveries/{id}/retries:
    post:
      operationId: retryHukidDelivery
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Delivery requeued}, '409': {$ref: '#/components/responses/Problem'}}
  /public/v1/certificates/{code}:
    get:
      operationId: verifyCertificate
      security: []
      parameters: [{in: path, name: code, required: true, schema: {type: string}}]
      responses: {'200': {description: Verification result}, '404': {$ref: '#/components/responses/Problem'}}
components:
  schemas:
    ReportJobCreate: {type: object, required: [event_id], properties: {event_id: {type: string}, scope: {type: string}, format: {type: string, enum: [csv, json]}}}
    CertificateCreate: {type: object, required: [event_id, registration_id, display_name], properties: {event_id: {type: string}, registration_id: {type: string}, display_name: {type: string}}}
    ParticipationCredentialCreate: {type: object, required: [event_id, registration_id, ticket_id], properties: {event_id: {type: string}, registration_id: {type: string}, ticket_id: {type: string}}}
    HukidDeliveryCreate: {type: object, required: [consent], properties: {consent: {type: boolean, description: Explicit consent to include displayName in the verifiable credential claims}}}
    Problem: {type: object, required: [type, title, status, code], properties: {type: {type: string}, title: {type: string}, status: {type: integer}, code: {type: string}, detail: {type: string}}}
  responses: {Problem: {description: RFC 9457 problem, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}}
